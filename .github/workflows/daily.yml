name: Daily Rates Refresh

on:
  schedule:
    # 每天北京时间 09:30（UTC 01:30）执行一次
    # GitHub Actions cron 最小粒度为 5 分钟，且不保证准时；这里设为 01:30 UTC
    - cron: '30 1 * * *'
  # 支持手动触发（Actions → 选 workflow → Run workflow）
  workflow_dispatch:

permissions:
  contents: write   # 需要写权限才能 commit 回仓库

concurrency:
  group: daily-rates
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape
        run: python scripts/scraper.py

      - name: Commit changes
        run: |
          # 只有 docs/rates.json 变化时才提交
          if git diff --quiet docs/rates.json; then
            echo "No changes, skip commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/rates.json
          git commit -m "chore(rates): daily refresh $(date -u +'%Y-%m-%d')"
          git push

      # ========================================
      # GitHub Pages 自动部署
      # 不需要任何 secrets 或外部服务：
      # 1. 在仓库 Settings → Pages 开启 main 分支 /docs 目录
      # 2. docs/CNAME 文件告诉 GitHub 自定义子域名 lilv.dafei-python.cn
      # 3. 每次 push docs/rates.json 后，GitHub Pages 自动重新部署
      # 4. 部署后访问 https://lilv.dafei-python.cn/rates.json
      # ========================================
